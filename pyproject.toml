[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solardss"
version = "0.1.0"
description = "Standalone deterministic decision-support library for solar PV siting and screening."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SolarDSS contributors" }]
keywords = ["solar", "pv", "siting", "suitability", "decision-support"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
gis = [
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "rasterio>=1.3",
]
era5 = [
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "cdsapi>=0.7.7",
]
pvlib = [
    "pvlib>=0.10,<0.13",
]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<0.13",
    "mypy>=1.10,<2",
    "pandas-stubs>=2.0",
    "xarray>=2023.1",
    "netCDF4>=1.6",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solardss = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = ["error::DeprecationWarning:solardss.*"]
markers = [
    "pvgis_live: hits the public PVGIS HTTP API; enable with SOLARDSS_PVGIS_LIVE=1",
    "era5_live: hits the Copernicus CDS ERA5-Land API; enable with SOLARDSS_ERA5_LIVE=1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "cdsapi",
    "netCDF4",
    "rasterio",
    "rasterio.*",
    "shapely",
    "shapely.*",
    "pyproj",
    "geopandas",
    "pvlib",
]
ignore_missing_imports = true
